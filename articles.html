<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的文章 - FC</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; line-height: 1.6; color: #333; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .filters { margin: 20px 0; }
        .filters button { background: #eee; border: none; padding: 8px 16px; margin-right: 10px; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .filters button.active { background: #333; color: #fff; }
        .post { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; display: none; }
        .post h2 { margin: 0 0 5px 0; font-size: 18px; }
        .post a { text-decoration: none; color: #0066cc; }
        .post .meta { font-size: 12px; color: #888; }
        .category-tag { background: #e0f7fa; color: #006064; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>我的文章</h1>
    
    <div class="filters">
        <button class="active" onclick="filter('all')">全部</button>
        <button onclick="filter('tech')">技术分享</button>
        <button onclick="filter('life')">生活随笔</button>
    </div>

    <div id="post-list">
        <div class="post" data-category="life">
            <h2><a href="post1.html">与或非的悲伤</a> <span class="category-tag">生活随笔</span></h2>
            <div class="meta">发布于：2026-10-31</div>
        </div>
        <div class="post" data-category="life">
    <h2><a href="post2.html">与或非·二</a> <span class="category-tag">生活随笔</span></h2>
    <div class="meta">发布于：2026-10-31</div>
</div>
        <div class="post" data-category="life">
    <h2><a href="post3.html">与或非·三</a> <span class="category-tag">生活随笔</span></h2>
    <div class="meta">发布于：2026-10-31</div>
        </div>
    </div>

    <script>
        window.onload = () => filter('all');
        function filter(category) {
            document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            document.querySelectorAll('.post').forEach(post => {
                if (category === 'all' || post.getAttribute('data-category') === category) {
                    post.style.display = 'block';
                } else {
                    post.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
