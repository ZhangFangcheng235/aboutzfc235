<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZhangFangCheng的直播间</title>
    <style>
        /* 清除页面默认边距，让直播画面全屏显示 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 隐藏滚动条 */
            background-color: #f3f4f6; /* 设置一个浅灰背景，防止加载时白屏 */
        }
        
        /* 强制 iframe 铺满整个浏览器窗口 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 你的直播间嵌入代码 -->
    <iframe
      src="https://a09d93fca8aea2bdb.app.workbuddy.host/embed?muted=1"
      width="100%"
      height="100%"
      style="border:0;overflow:hidden;"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      loading="lazy"
      title="方程的直播间"
    ></iframe>

</body>
</html>
